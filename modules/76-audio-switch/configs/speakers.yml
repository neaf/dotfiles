title: "BlackHole 2ch -> MacBook Air Speakers, EQ"

devices:
  samplerate: 48000
  chunksize: 1024
  enable_rate_adjust: true
  adjust_period: 3
  target_level: 1024
  capture:
    type: CoreAudio
    channels: 2
    device: "BlackHole 2ch"
    format: F32
  playback:
    type: CoreAudio
    channels: 2
    device: "MacBook Air Speakers"
    format: F32

# Flat to start. Edit gains here or in CamillaGUI. Lower preamp by the
# largest boost so peaks do not clip.
filters:
  preamp:
    type: Gain
    parameters:
      gain: 0
  bass:
    type: Biquad
    parameters:
      type: Lowshelf
      freq: 105
      q: 0.7
      gain: 0
  mid:
    type: Biquad
    parameters:
      type: Peaking
      freq: 1000
      q: 1.0
      gain: 0
  treble:
    type: Biquad
    parameters:
      type: Highshelf
      freq: 8000
      q: 0.7
      gain: 0

pipeline:
  - type: Filter
    channels: [0, 1]
    names: [preamp, bass, mid, treble]
